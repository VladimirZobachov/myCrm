openapi: 3.0.3
info:
  title: MyCRM API
  description: 'ERP для монтажных работ (наружная реклама в ТЦ). Backend: Laravel
    12 + tymon/jwt-auth. Legacy-совместимость: MD5-пароли мигрируются на bcrypt при
    логине.'
  version: 1.0.0
servers:
- url: http://localhost:8000/api
  description: Local dev
tags:
- name: Auth
  description: Аутентификация (JWT)
- name: Orders
  description: Заявки на монтаж
- name: Users
  description: Пользователи (только админ)
- name: Me
  description: Личный кабинет
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        login:
          type: string
          example: admin
        email:
          type: string
          example: admin@mycrm.local
        fio:
          type: string
          example: Админ
        type_user:
          type: integer
          example: 1
          description: 1=админ, 2=менеджер, 3=монтажник
    Order:
      type: object
      properties:
        id:
          type: integer
        date_create:
          type: string
          format: date-time
        date:
          type: string
          format: date
        trc:
          type: string
          example: Гринвич
        trc_other:
          type: string
          nullable: true
        type_work:
          type: string
        brand:
          type: string
        where_print:
          type: string
        where_other:
          type: string
          nullable: true
        photo:
          type: string
          nullable: true
        price:
          type: number
          format: float
        price_admin:
          type: number
          format: float
          description: price*0.7
        importance:
          type: string
        importance_other:
          type: string
          nullable: true
        created_by:
          $ref: '#/components/schemas/User'
        created_for:
          $ref: '#/components/schemas/User'
          nullable: true
        comment_admin:
          type: string
          nullable: true
        comment_mounter:
          type: string
          nullable: true
        status:
          type: integer
          example: 1
          description: 1=В ожидании, 2=Принят, 3=Выполнено
        is_archived:
          type: integer
          example: 0
    LoginRequest:
      type: object
      required:
      - login
      - passwd
      properties:
        login:
          type: string
        passwd:
          type: string
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Вход (поддержка legacy MD5 + ленивая миграция на bcrypt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль
  /auth/register:
    post:
      tags:
      - Auth
      summary: Регистрация (менеджер/монтажник)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - email
              - passwd
              - type_user
              properties:
                login:
                  type: string
                email:
                  type: string
                fio:
                  type: string
                passwd:
                  type: string
                type_user:
                  type: integer
                  enum:
                  - 2
                  - 3
      responses:
        '201':
          description: Создано
  /auth/logout:
    post:
      tags:
      - Auth
      security:
      - bearerAuth: []
      summary: Выход (инвалидация токена)
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      tags:
      - Auth
      security:
      - bearerAuth: []
      summary: Текущий пользователь
      responses:
        '200':
          description: OK
  /orders:
    get:
      tags:
      - Orders
      security:
      - bearerAuth: []
      summary: Список заявок (ролевая фильтрация)
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: archived
        in: query
        schema:
          type: boolean
      - name: status
        in: query
        schema:
          type: integer
      - name: sort
        in: query
        schema:
          type: string
        description: sort=date|DESC
      responses:
        '200':
          description: Список с пагинацией
    post:
      tags:
      - Orders
      security:
      - bearerAuth: []
      summary: Создать заявку (админ/менеджер)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Создано
  /orders/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - Orders
      security:
      - bearerAuth: []
      summary: Детали заявки
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Orders
      security:
      - bearerAuth: []
      summary: Обновить (auto-assign для монтажника)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trc:
                  type: string
                price:
                  type: number
                created_for:
                  type: integer
      responses:
        '200':
          description: Обновлено
    delete:
      tags:
      - Orders
      security:
      - bearerAuth: []
      summary: Удалить (админ/менеджер-владелец)
      responses:
        '200':
          description: Удалено
  /orders/{id}/status:
    patch:
      tags:
      - Orders
      security:
      - bearerAuth: []
      summary: Сменить статус (auto-assign)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
      responses:
        '200':
          description: OK
  /orders/{id}/comment:
    patch:
      tags:
      - Orders
      security:
      - bearerAuth: []
      summary: Обновить комментарий (по роли)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - comment
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: OK
  /orders/{id}/archive:
    patch:
      tags:
      - Orders
      security:
      - bearerAuth: []
      summary: Архивация/разархивация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - archived
              properties:
                archived:
                  type: boolean
      responses:
        '200':
          description: OK
  /users:
    get:
      tags:
      - Users
      security:
      - bearerAuth: []
      summary: Список пользователей (только админ)
      responses:
        '200':
          description: OK
    post:
      tags:
      - Users
      security:
      - bearerAuth: []
      summary: Создать пользователя (только админ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - email
              - passwd
              - type_user
              properties:
                login:
                  type: string
                email:
                  type: string
                fio:
                  type: string
                passwd:
                  type: string
                type_user:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
      responses:
        '201':
          description: Создано
  /users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      tags:
      - Users
      security:
      - bearerAuth: []
      summary: Обновить пользователя (пустой passwd = не менять)
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Users
      security:
      - bearerAuth: []
      summary: Удалить (нельзя удалить себя)
      responses:
        '200':
          description: Удалено
  /me:
    get:
      tags:
      - Me
      security:
      - bearerAuth: []
      summary: Мой профиль
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Me
      security:
      - bearerAuth: []
      summary: Обновить свои данные (пустой passwd = не менять)
      responses:
        '200':
          description: OK
