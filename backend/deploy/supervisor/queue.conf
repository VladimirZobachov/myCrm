; Supervisor-конфиг для queue:work (задача #45).
; Держит один воркер database-очереди живым: до 3 попыток на джобу (backoff
; задаётся в самих Job'ах, см. App\Jobs\Concerns\RetriesMailDelivery),
; таймаут 60с на попытку — согласован с retry_after в config/queue.php.
;
; Установка: скопировать в /etc/supervisor/conf.d/mycrm-queue.conf на
; проде, поправить путь и пользователя, затем:
;   supervisorctl reread && supervisorctl update && supervisorctl start mycrm-queue:*

[program:mycrm-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mycrm/backend/artisan queue:work database --tries=3 --timeout=60 --sleep=3
directory=/var/www/mycrm/backend
numprocs=1
autostart=true
autorestart=true
startsecs=1
startretries=3
stopwaitsecs=3600
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/mycrm/backend/storage/logs/queue-worker.log
stopasgroup=true
killasgroup=true
