## deploy/nginx/mycrm.conf
## Задача #62: nginx-конфиг для crm.vvebmaster.ru
##
## ВАЖНО: этот файл — черновик для ручной установки на сервере, он НЕ применяется
## автоматически. См. deploy/nginx/README.md для порядка подключения.

server {
    listen 80;
    listen [::]:80;
    server_name crm.vvebmaster.ru;

    # certbot кладёт сюда ACME-challenge и сам добавит редирект на 443
    # после первого выпуска сертификата (см. README, шаг 2).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.vvebmaster.ru;

    # Пути подставит certbot --nginx при выпуске сертификата (как в n8n.conf)
    ssl_certificate     /etc/letsencrypt/live/crm.vvebmaster.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.vvebmaster.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    client_max_body_size 20m;

    access_log /var/log/nginx/crm.vvebmaster.ru.access.log;
    error_log  /var/log/nginx/crm.vvebmaster.ru.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Роутинг по куке mycrm_token (legacy v1 на 8080 / новый v2 на 3000) ---
    # Раскомментировать и заменить блок "location /" выше на этот вариант,
    # когда потребуется постепенный перевод пользователей на v2 по флагу
    # migrated_to_v2 (см. php artisan migrate:flag-role в README).
    #
    # map $cookie_mycrm_token $mycrm_upstream {
    #     default   127.0.0.1:3000;   # v2 по умолчанию
    #     "legacy"  127.0.0.1:8080;   # значение куки, которое ставит backend для v1-пользователей
    # }
    #
    # location / {
    #     proxy_pass http://$mycrm_upstream;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
